name: Build Offline Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies & Build Web App
        run: |
          npm install
          npm run build

      - name: Configure Capacitor & Build Android Project
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Pro Titanic Soccer" "com.srstudio.protitanicsoccer" --web-dir=dist
          npx cap add android
          npx cap sync android

      - name: Lock Landscape Orientation
        run: |
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="sensorLandscape"/g' android/app/src/main/AndroidManifest.xml

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Offline APK
        uses: actions/upload-artifact@v4
        with:
          name: Pro-Titanic-Soccer-Offline-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
