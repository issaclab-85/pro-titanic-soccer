name: Build Offline Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies & Build Web App
        run: |
          cd pro-titanic-soccer
          npm install --legacy-peer-deps
          npm run build

      - name: Configure Capacitor & Build Android Project
        run: |
          cd pro-titanic-soccer
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android
          
          # Create a clean JSON config to avoid TypeScript parsing issues
          echo '{
            "appId": "com.srstudio.protitanicsoccer",
            "appName": "Pro Titanic Soccer",
            "webDir": "dist",
            "bundledWebRuntime": false,
            "android": {
              "allowMixedContent": true
            }
          }' > capacitor.config.json
          
          npx cap add android
          npx cap sync android

      - name: Lock Landscape Orientation
        run: |
          cd pro-titanic-soccer
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="sensorLandscape"/g' android/app/src/main/AndroidManifest.xml

      - name: Build Debug APK
        run: |
          cd pro-titanic-soccer/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Offline APK
        uses: actions/upload-artifact@v4
        with:
          name: Pro-Titanic-Soccer-Offline-APK
          path: pro-titanic-soccer/android/app/build/outputs/apk/debug/app-debug.apk
